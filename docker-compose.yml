services:
  portfolio-advisor:
    build: .
    ports:
      - "${PORT:-7860}:7860"
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      PORT_LOG_FILE: "${PORT_LOG_FILE:-}"
