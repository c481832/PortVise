repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - langchain-core
          - langchain-openai
          - langgraph
          - sse-starlette
          - fastapi
          - yfinance
