# LLM endpoint
[llm]
base_url = ""
model = ""
api_key = ""
model_options = ""
model_base_urls = ""
model_extra_args = ""

# Timeouts / retries
connect_timeout = 30.0
read_timeout = 1200.0
max_retries = 2
invoke_max_attempts = 4
retry_base_seconds = 1.5

# Token ceilings
max_tokens_ceiling = 32768
length_markers = ["length limit", "length_limit", "finish_reason: length", "max_tokens"]
planner_temperature = 0.2
planner_max_tokens = 2048
summary_temperature = 0.1
summary_max_tokens = 768
structured_temperature = 0.1
structured_max_tokens = 4096

# Per-agent model overrides (empty = llm.model). Order matches the review pipeline.
[agents]
planner = ""
news_summary = ""
risk = ""
regime = ""
theme = ""
allocation = ""
manager = ""
agent_summary = ""

[log]
file = "logs/advisor.log"
max_bytes = 10485760
backup_count = 5

# News search
[search]
provider = "searxng"
user_agent = "advisor/0.1 (news-tools)"

# SearXNG
searxng_url = "http://127.0.0.1:8888"

# Tavily
tavily_api_key = ""
tavily_topic = "news"
tavily_days = 7

# Request behavior
concurrent_requests = 4
provider_max_attempts = 2
provider_backoff_seconds = 1.0
request_timeout_seconds = 30.0

# Result shaping
default_max_results = 8
body_truncation_chars = 400

[market]
local_data_dir = "data/market"
price_history_period = "max"
yfinance_timeout_seconds = 8.0
fetch_max_attempts = 3
fetch_backoff_base_seconds = 0.75

[fred]
api_key = ""
series_ids = ["BAMLC0A0CM", "DGS10", "DFII10", "KCROROL"]

[macro]
indicator_universe = [
    "GLD",
    "USO",
    "GSG",
    "^TNX",
    "EEM",
    "EFA",
    "SPY",
    "QQQ",
    "XLF",
    "^VIX",
    "BAMLC0A0CM",
    "SHY",
    "DGS10",
    "TLT",
    "DFII10",
    "KCROROL",
]
lookback_period = "max"
interval = "1d"
change_window_days = 22
thread_pool_size = 12
fetched_at_format = "%Y-%m-%d %H:%M UTC"

[macro.indicator_labels]
GLD = "Gold"
USO = "Oil (WTI proxy)"
GSG = "Commodities (GSCI)"
"^TNX" = "US 10Y Yield"
EEM = "Developing Markets Equity"
EFA = "Developed Markets Equity"
SPY = "S&P 500"
QQQ = "Nasdaq 100"
XLF = "Sector ETF"
"^VIX" = "VIX"
BAMLC0A0CM = "US IG Credit OAS"
SHY = "Short-End Treasuries (1-3Y)"
DGS10 = "Nominal 10Y Yield"
TLT = "Long-End Treasuries (20Y+)"
DFII10 = "Real 10Y Yield"
KCROROL = "Kansas City Fed Liquidity Index"

[risk_engine]
yfinance_timeout_seconds = 8.0
min_observations = 90
min_return_coverage = 0.5
correlation_threshold = 0.3
trading_days_per_year = 252

# Factor model: joint regression on the market, tilts vs market, and macro factors.
[risk_engine.factor_model]
market = "SPY"

[risk_engine.factor_model.tilts]
growth = "QQQ"
financials = "XLF"
em = "EEM"

[risk_engine.factor_model.macro]
long_bonds = "TLT"
gold = "GLD"
oil = "USO"
usd = "UUP"

[[risk_engine.historical_scenarios]]
name = "2000 internet bubble"
start = "2000-03-10"
end = "2000-04-14"

[[risk_engine.historical_scenarios]]
name = "2008 subprime crisis"
start = "2008-09-15"
end = "2008-11-20"

[[risk_engine.historical_scenarios]]
name = "COVID crash"
start = "2020-02-19"
end = "2020-03-23"

[[risk_engine.historical_scenarios]]
name = "2022 inflation shock"
start = "2022-01-03"
end = "2022-10-14"

[[risk_engine.historical_scenarios]]
name = "2023 regional bank stress"
start = "2023-03-08"
end = "2023-03-24"

[regime]
volatility_ticker = "^VIX"
top_n_analogs = 3
backtest_lookback_days = 21
backtest_forward_days = 21
backtest_min_analog_gap_days = 21
backtest_min_aligned_observations = 120

[regime.analog_tickers]
rates = "^TNX"
equity = "SPY"
em = "EEM"
gold = "GLD"
oil = "USO"
financials = "XLF"

[regime.indicator_thresholds.rates]
high = 0.5
low = -0.5

[regime.indicator_thresholds.growth]
high = 0.5
low = -0.5

[regime.indicator_thresholds.inflation]
high = 0.5
low = -0.5

[regime.indicator_thresholds.volatility_vix_level]
high = 20.0
low = -1.0

[regime.indicator_thresholds.volatility_vix_change]
high = 10.0
low = -1.0

[regime.indicator_thresholds.volatility_uso_change]
high = 6.0
low = -6.0

[regime.indicator_thresholds.volatility_eem_change]
high = 999.0
low = -3.0

[regime.indicator_thresholds.liquidity_eem_spy_gap]
high = 1.0
low = 0.0

[capital_allocation]
min_allocated_capital = 0.80
max_drawdown = 0.50
cash_yield_annual_pct = 0.0

[server]
host = "127.0.0.1"
port = 7860
log_level = "info"
heartbeat_seconds = 5.0
sse_stream_version = "v2"
ticker_regex_pattern = "^[A-Z0-9^.\\-]{1,16}$"
llm_test_timeout_seconds = 10.0
llm_test_temperature = 0.0
llm_test_max_tokens = 8
# Block settings changes, endpoint tests and per-review endpoint/key overrides from the web UI.
# Turn on when other people can reach the server (env: ADVISOR_LOCK_SETTINGS=true).
lock_settings = false

[truncation]
log_safe_text_max_chars = 12000
error_detail_chars = 300

# Prompt budgets (pipeline order)
[prompts.planner]
portfolio_query_count = 3
max_query_chars = 220

[prompts.news]
macro_context_sentence_max = 2
themes_min = 3
themes_max = 5
key_events_max = 6

[prompts.risk]
top_risks_min = 3
top_risks_max = 7

[prompts.regime]
summary_sentence_min = 2
summary_sentence_max = 4

[prompts.theme]
research_excerpt_max_chars = 14000
per_ticker_research_max_chars = 3000
per_ticker_item_max_chars = 1300

[prompts.allocation]
summary_sentence_min = 2
summary_sentence_max = 4
deployment_candidates_min = 3
deployment_candidates_max = 6

[prompts.manager]
top_risks_max = 4
scenario_losses_max = 3
concentration_issues_max = 3
hidden_concentration_max = 3
risk_contribution_tickers_max = 5
regime_analogs_max = 2
regime_mismatch_drivers_max = 4
regime_tilts_max = 4
theme_assessments_max = 4
theme_list_items_max = 4
allocation_conflicts_max = 4

[agent_summary]
max_input_chars = 32000

[track_record]
# Minimum trading days of post-recommendation history before a call is scored.
min_comparison_days = 5
