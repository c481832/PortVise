[project]
name = "advisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=1.1.14",
    "langchain-core>=1.3.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.27.0",
    "sse-starlette>=1.8.0",
    "yfinance>=0.2.50",
    "tavily-python>=0.7.23",
    "curl-cffi>=0.15.0",
    "langsmith>=0.8.18",
    "tomlkit>=0.15.0",
]

[project.scripts]
advisor-review = "advisor.cli:main"
arena = "arena.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "pip-audit>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor", "src/arena"]

[tool.hatch.build.targets.wheel.force-include]
"src/arena/config.toml" = "arena/config.toml"
"src/arena/config.example.json" = "arena/config.example.json"

[tool.ruff]
line-length = 100
extend-exclude = [
    ".codex",
    ".playwright-cli",
    ".playwright-mcp",
    "test-results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["advisor", "arena"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
