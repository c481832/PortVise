[project]
name = "port"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=1.1.14",
    "langchain-core>=1.2.28",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=1.8.0",
    "yfinance>=0.2.50",
    "tavily-python>=0.7.23",
    "curl-cffi>=0.15.0",
    "duckduckgo-search>=8.1.1",
    "langsmith>=0.7.31",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
    "pip-audit>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["port"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=port --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = ["port/prompts.py"]
